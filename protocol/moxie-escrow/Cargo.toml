[package]
name = "moxie-escrow"
version = "0.1.0"
edition = "2021"
description = "Opaque Solana USDC escrow for Moxie. The market intent is a commitment until settlement."
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "moxie_escrow"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
